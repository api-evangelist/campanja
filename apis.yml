x-status-detail: Acquired by [24]7.ai on 2015-08-24 and absorbed into the [24]7 Customer Acquisition
  Cloud as its Advanced Bid Optimization component; the independent product was retired. campanja.com
  is a registered but web-dead domain — re-probed 2026-08-12, it still publishes NS (AWS Route 53),
  MX (Google Workspace) and SPF/site-verification TXT records but has NO A or AAAA record, so every
  HTTPS request fails at DNS resolution. The only resolving subdomain is docs.campanja.com, a
  dangling legacy Google-hosted CNAME (ghs.google.com) that returns Google's own 404 on every path.
  api.campanja.com and developer.campanja.com do not resolve. No developer portal, API,
  documentation, SDK, package, or agent surface exists to enrich, and none is recoverable from the
  Wayback archive of the site.
